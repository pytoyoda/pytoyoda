name: "Test code"

env:
  COLUMNS: 120

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  pytest:
    name: "Pytest"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    env:
      OS: "ubuntu-latest"
      PYTHON: "${{ matrix.python-version }}"
    steps:
      - name: "⤵️ Check out code from GitHub"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: "🐍 Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v7"
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "⚙️ Install Poetry"
        uses: "abatilo/actions-poetry@v4.0.0"
      - name: "⚙️ Install dependencies"
        run: "poetry install"
      - name: "🚀 Run pytest with coverage"
        run: |
          poetry run pytest --junitxml=pytest${{ matrix.python-version }}.xml --cov-report=term-missing:skip-covered --cov=pytoyoda | tee pytest-coverage${{ matrix.python-version }}.txt
      - name: "⬆️ Archive pytest junitxml results"
        uses: actions/upload-artifact@v7
        with:
          name: pytest${{ matrix.python-version }}
          path: ./pytest${{ matrix.python-version }}.xml
          retention-days: 1
      - name: "⬆️ Archive pytest coverage results"
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage${{ matrix.python-version }}
          path: ./pytest-coverage${{ matrix.python-version }}.txt
          retention-days: 1
      - name: "⬆️ Archive PR number"
        if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
        run: echo "${{ github.event.number }}" > pr_number.txt
      - name: "⬆️ Upload PR number"
        if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: pr_number
          path: ./pr_number.txt
          retention-days: 1
